// ─── SM-2 ───────────────────────────────────────────────────────────────────
function sm2(card, quality) {
  let { easeFactor, interval, repetitions } = card;
  if (quality >= 3) {
    if (repetitions === 0) interval = 1;
    else if (repetitions === 1) interval = 6;
    else interval = Math.round(interval * easeFactor);
    repetitions += 1;
    easeFactor = Math.max(1.3, easeFactor + 0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
  } else { repetitions = 0; interval = 1; }
  return { ...card, easeFactor, interval, repetitions, nextReview: Date.now() + interval * 86400000, lastReviewed: Date.now() };
}

function mk(id, front, back) {
  return { id, front, back, interval:1, easeFactor:2.5, nextReview:Date.now(), repetitions:0, lastReviewed:null };
}

function saveAll(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) { console.warn("Save failed", e); }
}

function loadAll() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (e2) { return null; }
}

function mergeDecks(saved) {
  if (!saved) return SEED_DECKS;
  const savedDecks = saved.decks || saved; // support both old and new format
  const seedIds = new Set(SEED_DECKS.map(d=>d.id));
  const customDecks = (Array.isArray(savedDecks) ? savedDecks : []).filter(d=>!seedIds.has(d.id));
  return [
    ...SEED_DECKS.map(deck => {
      const sd = (Array.isArray(savedDecks) ? savedDecks : []).find(d=>d.id===deck.id);
      if (!sd) return deck;
      return { ...deck, cards: deck.cards.map(c => {
        const sc = (sd.cards||[]).find(x=>x.id===c.id);
        return sc ? { ...c, ...sc } : c;
      }).concat((sd.cards||[]).filter(c=>!deck.cards.some(x=>x.id===c.id))) };
    }),
    ...customDecks
  ];
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
function getStreak(history) {
  if (!history || !history.length) return 0;
  const today = dayKey(Date.now());
  const yesterday = dayKey(Date.now() - 86400000);
  const days = [...new Set(history.map(h => dayKey(h)))].sort().reverse();
  if (days[0] !== today && days[0] !== yesterday) return 0;
  let streak = 0;
  let expected = days[0] === today ? today : yesterday;
  for (const d of days) {
    if (d === expected) { streak++; expected = dayKey(new Date(expected).getTime() - 86400000); }
    else break;
  }
  return streak;
}

function getDueCards(decks, limit=MAX_DAILY) {
  const now = Date.now();
  return decks.flatMap(d => d.cards.filter(c=>c.nextReview<=now).map(c=>({...c,deckId:d.id,deckTitle:d.title,deckEmoji:d.emoji}))).slice(0,limit);
}

function nextReviewLabel(ts) {
  const diff = ts - Date.now();
  if (diff <= 0) return "الآن";
  const mins = Math.floor(diff/60000);
  const hours = Math.floor(diff/3600000);
  const days = Math.floor(diff/86400000);
  if (mins < 60) return `${mins} دقيقة`;
  if (hours < 24) return `${hours} ساعة`;
  return `${days} يوم`;
}

// ─── THEME HOOK ──────────────────────────────────────────────────────────────
function useTheme() {
  const [dark, setDark] = useState(() => {
    try { return localStorage.getItem("theme_v2") === "dark"; } catch (e3) { return false; }
  });
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    try { localStorage.setItem("theme_v2", dark ? "dark" : "light"); } catch (e4) {}
  }, [dark]);
  return [dark, () => setDark(d=>!d)];
}
